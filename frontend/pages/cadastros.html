<div class="container">
    <h2><i class="fa-solid fa-user-plus"></i> Cadastros</h2>
    <h3>Cadastre um registro por vez para manter tudo organizado</h3>

    <div class="tabs">
        <button class="tab active" data-tab="cliente">Cliente</button>
        <button class="tab" data-tab="entregador">Entregador</button>
        <button class="tab" data-tab="encomenda">Encomenda</button>
        <button class="tab" data-tab="pedido">Pedido</button>
    </div>

    <div class="tab-content" id="tab-cliente">
        <h3>Cadastro de Cliente</h3>
        <strong><input type="text" id="c-id-gerado" placeholder="ID gerado" readonly></strong>
        <input type="text" id="c-nome" placeholder="Nome">
        <input type="text" id="c-cpf" placeholder="000.000.000-00" inputmode="numeric" maxlength="14">
        <input type="email" id="c-email" placeholder="Email">
        <input type="text" id="c-localizacao" placeholder="Localização">
        <button onclick="cadastrarCliente()">Cadastrar Cliente</button>
        <p id="c-msg"></p>
    </div>

    <div class="tab-content hidden" id="tab-entregador">
        <h3>Cadastro de Entregador</h3>
        <strong><input type="text" id="e-id-gerado" placeholder="ID gerado" readonly></strong>
        <input type="text" id="e-nome" placeholder="Nome">
        <input type="text" id="e-cpf" placeholder="000.000.000-00" inputmode="numeric" maxlength="14">
        <input type="email" id="e-email" placeholder="Email">
        <input type="text" id="e-numero" placeholder="(00) 00000-0000" inputmode="numeric" maxlength="15">
        <button onclick="cadastrarEntregador()">Cadastrar Entregador</button>
        <p id="e-msg"></p>
    </div>

    <div class="tab-content hidden" id="tab-encomenda">
        <h3>Cadastro de Encomenda</h3>
        <strong><input type="text" id="en-id-gerado" placeholder="ID gerado" readonly></strong>
        <input type="text" id="en-codigo" placeholder="Código único">
        <input type="text" id="en-nome" placeholder="Nome da encomenda">
        <input type="number" id="en-quantidade" placeholder="Quantidade">
        <button onclick="cadastrarEncomenda()">Cadastrar Encomenda</button>
        <p id="en-msg"></p>
    </div>

    <div class="tab-content hidden" id="tab-pedido">
        <h3>Cadastro de Pedido</h3>
        <input type="text" id="p-id-cliente" placeholder="ID do Cliente">
        <input type="text" id="p-id-entregador" placeholder="ID do Entregador">
        <input type="text" id="p-id-encomenda" placeholder="ID da Encomenda">
        <select id="p-status">
            <option value="Pendente">Pendente</option>
            <option value="Em trânsito">Em trânsito</option>
            <option value="Entregue">Entregue</option>
            <option value="Cancelado">Cancelado</option>
        </select>
        <button class="btn-pedido" onclick="cadastrarPedido()">Cadastrar Pedido</button>
        <p id="p-msg"></p>
    </div>

    <div style="text-align:center; margin-top:20px;">
        <button class="btn-update" onclick="alternarSecaoComTransicao('cadastros', 'atualizar')">
            Precisa atualizar um registro? Clique aqui
        </button>
    </div>
</div>
