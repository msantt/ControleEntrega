<div class="container">
    <h2><i class="fa-solid fa-chart-column"></i> Gráficos</h2>
    <h3>Visualização detalhada por semana, mês e ano</h3>

    <div class="chart-box" style="margin-top: 20px;">
        <div class="tabs">
            <button class="tab active" data-periodo="semana">Semana</button>
            <button class="tab" data-periodo="mes">Mês</button>
            <button class="tab" data-periodo="ano">Ano</button>
        </div>

        <div class="chart-wrapper" style="height: 350px;">
            <canvas id="chartProdutividade"></canvas>
        </div>
    </div>
</div>
